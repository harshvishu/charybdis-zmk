name: Draw ZMK keymaps

on:
  pull_request:
    paths:
      - ".github/workflows/draw-keymaps.yml"
      - "config/*.keymap"
      - "config/*.dtsi"
      - "config/info.json"
      - "keymap_drawer.config.yaml"

concurrency:
  group: draw-keymaps-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@v0.23.0
    with:
      keymap_patterns: "config/*.keymap"
      config_path: "keymap_drawer.config.yaml"
      west_config_path: "config"
      output_folder: "keymap-drawer"
      parse_args: ""
      draw_args: "charybdis:'-j config/info.json -l default_transform'"
      destination: "artifact"
      artifact_name: "keymap-drawer"
      fail_on_error: true

  verify:
    name: Verify committed keymap
    needs: draw
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Download rendered keymap
        uses: actions/download-artifact@v4
        with:
          name: keymap-drawer
          path: generated-keymap

      - name: Verify generated files are current
        run: |
          diff --brief keymap-drawer/charybdis.yaml generated-keymap/charybdis.yaml
          diff --brief keymap-drawer/charybdis.svg generated-keymap/charybdis.svg
